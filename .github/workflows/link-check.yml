name: link-check

# Weekly liveness sweep of every share link.
#
# Injection review:
#   - No `github.event.*` value is referenced anywhere in this workflow, so no
#     attacker-controlled string reaches a `run:` block.
#   - The only expression used is `${{ github.token }}`, which is not user data.
#   - Fetched page content never touches a command line: check_links.py writes
#     its report to a file and `gh` reads it with --body-file.

on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    name: Re-check every x.ai/bot share
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep share links
        id: sweep
        # `run:` uses `bash -e`, so a failing pipeline would abort the step before
        # the output is written. Disable -e, take the python exit code out of
        # PIPESTATUS (tee always succeeds), and hand the status on via an output.
        run: |
          set +e
          python3 scripts/check_links.py | tee sweep.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "check_links.py exited $status"
          exit 0

      # exit 1 — some shares are genuinely gone (404/410). This is a data problem.
      - name: Report dead shares
        if: steps.sweep.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly sweep found shares in the \`gone\` bucket — the page answered, and said the bot is not there."
            echo
            echo '```'
            cat sweep.txt
            echo '```'
            echo
            echo "Rows in the \`blocked\` or \`flaky\` buckets, if any, were **left in the catalog on purpose**:"
            echo "those statuses describe the network path or the host, not the bot."
            echo
            echo "To fix: run \`python3 scripts/check_links.py --write\` locally, then"
            echo "\`python3 scripts/build_readme.py\`, and commit \`catalog.json\`, \`retired.json\` and both READMEs."
          } > report.md
          gh issue create \
            --title "link-check: dead shares found in the weekly sweep" \
            --label "entry-problem" \
            --body-file report.md

      # exit 2 — too much of the sweep came back blocked/flaky to trust any of it.
      # This is an infrastructure problem and must not be filed as broken data.
      - name: Report unreachable sweep
        if: steps.sweep.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly sweep tripped its circuit breaker: too much of the run came back"
            echo "\`blocked\` (a bot wall) or \`flaky\` (a 5xx or timeout) to draw any conclusion"
            echo "about the catalog."
            echo
            echo '```'
            cat sweep.txt
            echo '```'
            echo
            echo "**No catalog rows are implicated.** This usually means x.ai started challenging"
            echo "the GitHub Actions runner's datacenter IP, or the host had an outage during the run."
            echo
            echo "Confirm by re-running \`python3 scripts/check_links.py\` from a residential network"
            echo "before changing any data."
          } > report.md
          gh issue create \
            --title "link-check: sweep could not reach x.ai (circuit breaker tripped)" \
            --label "infrastructure" \
            --body-file report.md

      - name: Upload sweep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-log
          path: sweep.txt
          retention-days: 30
