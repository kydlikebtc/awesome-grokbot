name: link-check

# Weekly liveness sweep of every share link.
#
# Injection review:
#   - No `github.event.*` value is referenced anywhere in this workflow, so no
#     attacker-controlled string reaches a `run:` block.
#   - The only expression used is `${{ github.token }}`, which is not user data.
#   - Fetched page content never touches a command line: check_links.py writes
#     its report to a file and `gh` reads it with --body-file.

on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    name: Re-check every x.ai/bot share
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep share links
        id: sweep
        # `run:` uses `bash -e`, so a failing pipeline would abort the step before
        # the output is written. Disable -e, take the python exit code out of
        # PIPESTATUS (tee always succeeds), and hand the status on via an output.
        run: |
          set +e
          python3 scripts/check_links.py | tee sweep.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "check_links.py exited $status"
          exit 0

      - name: Build report body
        if: steps.sweep.outputs.exit_code != '0'
        run: |
          {
            echo "The weekly sweep found share links that no longer return HTTP 200."
            echo
            echo '```'
            cat sweep.txt
            echo '```'
            echo
            echo "To fix: move the dead rows from \`catalog.json\` to \`retired.json\` with their"
            echo "real \`link_status\`, run \`python3 scripts/build_readme.py\`, and commit both READMEs."
            echo
            echo "Or run \`python3 scripts/check_links.py --write\` locally to do the move automatically."
          } > report.md

      - name: Open an issue
        if: steps.sweep.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "link-check: dead shares found in the weekly sweep" \
            --label "entry-problem" \
            --body-file report.md

      - name: Upload sweep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-log
          path: sweep.txt
          retention-days: 30
