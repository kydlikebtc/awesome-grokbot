  <rect x="13" y="43" width="21" height="4.5" rx="2.25" fill="#f2eee5" opacity=".34"/>
  <circle cx="47" cy="19" r="7.5" fill="#bc4a28" stroke="#1c1a16" stroke-width="3.5"/>
</svg>
